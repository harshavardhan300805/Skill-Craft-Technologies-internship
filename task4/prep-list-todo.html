<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prep List — Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1512;
    --panel: #241C17;
    --panel-2: #2B221C;
    --cream: #F5EFE6;
    --caramel: #C97C3D;
    --brass: #D4A25A;
    --mocha: #8A6E52;
    --line: rgba(245,239,230,0.12);
    --danger: #C9603D;
    --done: #6C8C6A;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    display:flex;
    justify-content:center;
    padding: 48px 20px;
  }
  .app{
    width:100%;
    max-width: 980px;
    display:grid;
    grid-template-columns: 260px 1fr;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow:hidden;
    min-height: 620px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 28px 20px;
    display:flex;
    flex-direction:column;
  }
  .sidebar h1{
    font-family:'Fraunces', serif;
    font-size: 20px;
    font-weight:600;
    margin: 0 0 2px;
  }
  .sidebar .sub{
    font-size: 12.5px;
    color: rgba(245,239,230,0.45);
    margin-bottom: 28px;
  }
  .list-nav{
    list-style:none;
    margin:0; padding:0;
    flex:1;
  }
  .list-nav li{
    margin-bottom: 4px;
  }
  .list-btn{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color: var(--cream);
    font-family:'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 6px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    opacity: .72;
    transition: background .15s ease, opacity .15s ease;
  }
  .list-btn:hover{ background: rgba(245,239,230,0.05); opacity: 1; }
  .list-btn.active{ background: rgba(212,162,90,0.14); color: var(--brass); opacity:1; font-weight:600; }
  .list-btn .count{
    font-size: 11.5px;
    background: rgba(245,239,230,0.08);
    padding: 2px 7px;
    border-radius: 999px;
    color: rgba(245,239,230,0.6);
  }
  .list-btn.active .count{ background: rgba(212,162,90,0.25); color: var(--brass); }

  .new-list{
    display:flex;
    gap: 8px;
    margin-top: 16px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .new-list input{
    flex:1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--cream);
    font-size: 13px;
    padding: 9px 10px;
    font-family:'Inter', sans-serif;
  }
  .new-list input::placeholder{ color: rgba(245,239,230,0.35); }
  .new-list button{
    background: var(--brass);
    color: var(--bg);
    border:none;
    border-radius: 6px;
    font-weight:700;
    font-size: 16px;
    width: 36px;
    cursor:pointer;
  }

  /* ---------- Main panel ---------- */
  .main{
    background: var(--bg);
    padding: 32px 34px;
    display:flex;
    flex-direction:column;
  }
  .main-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom: 22px;
  }
  .main-header h2{
    font-family:'Fraunces', serif;
    font-size: 22px;
    font-weight:600;
    margin:0 0 4px;
  }
  .main-header p{
    margin:0;
    font-size: 13px;
    color: rgba(245,239,230,0.45);
  }
  .delete-list{
    background:none;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 12px;
    padding: 7px 13px;
    border-radius: 999px;
    cursor:pointer;
  }

  .add-form{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    display:grid;
    grid-template-columns: 1fr 140px 110px auto;
    gap: 10px;
    margin-bottom: 26px;
  }
  .add-form input{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--cream);
    font-size: 13.5px;
    padding: 10px 12px;
    font-family:'Inter', sans-serif;
  }
  .add-form input::placeholder{ color: rgba(245,239,230,0.35); }
  .add-form input[type="date"],
  .add-form input[type="time"]{ color-scheme: dark; }
  .add-form button{
    background: var(--brass);
    color: var(--bg);
    border:none;
    border-radius: 6px;
    font-weight:700;
    font-size: 14px;
    padding: 0 20px;
    cursor:pointer;
  }

  .task-list{
    list-style:none;
    margin:0; padding:0;
    flex:1;
  }
  .task{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 14px 6px;
    border-top: 1px solid var(--line);
  }
  .task:first-child{ border-top:none; }
  .task-check{
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--mocha);
    background:none;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color: transparent;
    font-size: 12px;
    transition: all .15s ease;
  }
  .task.done .task-check{
    background: var(--done);
    border-color: var(--done);
    color: var(--bg);
  }
  .task-body{ flex:1; min-width:0; }
  .task-title{
    font-size: 14.5px;
    word-break: break-word;
  }
  .task.done .task-title{
    text-decoration: line-through;
    color: rgba(245,239,230,0.4);
  }
  .task-meta{
    font-size: 12px;
    color: var(--brass);
    margin-top: 3px;
  }
  .task.done .task-meta{ color: rgba(245,239,230,0.3); }
  .task-actions{ display:flex; gap: 8px; flex-shrink:0; }
  .icon-btn{
    background:none;
    border: 1px solid var(--line);
    color: rgba(245,239,230,0.6);
    border-radius: 6px;
    font-size: 12px;
    padding: 6px 10px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .icon-btn:hover{ color: var(--cream); border-color: var(--mocha); }
  .icon-btn.danger:hover{ color: var(--danger); border-color: var(--danger); }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: rgba(245,239,230,0.35);
    font-size: 14px;
  }

  /* inline edit mode */
  .task.editing .task-body{ display:none; }
  .edit-form{
    flex:1;
    display:none;
    gap: 8px;
    grid-template-columns: 1fr 130px 100px;
  }
  .task.editing .edit-form{ display:grid; }
  .edit-form input{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--cream);
    font-size: 13px;
    padding: 8px 10px;
    font-family:'Inter', sans-serif;
  }
  .edit-form input[type="date"],
  .edit-form input[type="time"]{ color-scheme: dark; }

  @media (max-width: 760px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ border-right:none; border-bottom: 1px solid var(--line); }
    .add-form{ grid-template-columns: 1fr; }
    .edit-form{ grid-template-columns: 1fr; }
    .task{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h1>Prep List</h1>
    <div class="sub">Meridian roastery tasks</div>
    <ul class="list-nav" id="listNav"></ul>
    <div class="new-list">
      <input type="text" id="newListInput" placeholder="New list name" maxlength="30">
      <button id="newListBtn">+</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <h2 id="activeListName">—</h2>
        <p id="activeListSub">0 tasks</p>
      </div>
      <button class="delete-list" id="deleteListBtn">Delete list</button>
    </div>

    <div class="add-form">
      <input type="text" id="taskTitleInput" placeholder="Add a task...">
      <input type="date" id="taskDateInput">
      <input type="time" id="taskTimeInput">
      <button id="addTaskBtn">Add</button>
    </div>

    <ul class="task-list" id="taskList"></ul>
  </main>
</div>

<script>
  const LISTS_KEY = 'meridian-prep-lists';

  const defaultData = [
    {
      id: 'l1', name: "Today's Prep",
      tasks: [
        { id: 't1', title: 'Dial in espresso grind', date: '', time: '07:30', done: false },
        { id: 't2', title: 'Weigh out single-origin lot for pour-over bar', date: '', time: '08:00', done: false },
        { id: 't3', title: 'Restock oat & whole milk', date: '', time: '', done: true }
      ]
    },
    {
      id: 'l2', name: 'Wholesale Orders',
      tasks: [
        { id: 't4', title: 'Pack 12x 250g bags for Fernwood Café', date: '', time: '', done: false }
      ]
    }
  ];

  function loadData(){
    try{
      const raw = localStorage.getItem(LISTS_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return JSON.parse(JSON.stringify(defaultData));
  }

  function saveData(){
    try{ localStorage.setItem(LISTS_KEY, JSON.stringify(data)); }catch(e){}
  }

  let data = loadData();
  let activeListId = data[0] ? data[0].id : null;
  let editingTaskId = null;

  const listNav = document.getElementById('listNav');
  const newListInput = document.getElementById('newListInput');
  const newListBtn = document.getElementById('newListBtn');
  const activeListName = document.getElementById('activeListName');
  const activeListSub = document.getElementById('activeListSub');
  const deleteListBtn = document.getElementById('deleteListBtn');
  const taskTitleInput = document.getElementById('taskTitleInput');
  const taskDateInput = document.getElementById('taskDateInput');
  const taskTimeInput = document.getElementById('taskTimeInput');
  const addTaskBtn = document.getElementById('addTaskBtn');
  const taskList = document.getElementById('taskList');

  function getActiveList(){
    return data.find(l => l.id === activeListId) || null;
  }

  function uid(){
    return 'id' + Math.random().toString(36).slice(2, 9);
  }

  function formatMeta(task){
    if(!task.date && !task.time) return '';
    const d = task.date ? new Date(task.date + 'T00:00:00') : null;
    const dateStr = d ? d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) : '';
    return [dateStr, task.time].filter(Boolean).join(' · ');
  }

  function renderLists(){
    listNav.innerHTML = '';
    data.forEach(list => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'list-btn' + (list.id === activeListId ? ' active' : '');
      const openCount = list.tasks.filter(t => !t.done).length;
      btn.innerHTML = '<span>' + escapeHtml(list.name) + '</span><span class="count">' + openCount + '</span>';
      btn.addEventListener('click', () => {
        activeListId = list.id;
        editingTaskId = null;
        renderLists();
        renderTasks();
      });
      li.appendChild(btn);
      listNav.appendChild(li);
    });
  }

  function renderTasks(){
    const list = getActiveList();
    taskList.innerHTML = '';
    if(!list){
      activeListName.textContent = 'No list selected';
      activeListSub.textContent = 'Create a list to get started';
      deleteListBtn.style.display = 'none';
      return;
    }
    deleteListBtn.style.display = '';
    activeListName.textContent = list.name;
    const openCount = list.tasks.filter(t => !t.done).length;
    activeListSub.textContent = openCount + (openCount === 1 ? ' task' : ' tasks') + ' remaining · ' + list.tasks.length + ' total';

    if(list.tasks.length === 0){
      taskList.innerHTML = '<li class="empty-state">Nothing on this list yet — add your first task above.</li>';
      return;
    }

    list.tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task' + (task.done ? ' done' : '') + (editingTaskId === task.id ? ' editing' : '');

      const check = document.createElement('button');
      check.className = 'task-check';
      check.innerHTML = task.done ? '&#10003;' : '';
      check.addEventListener('click', () => {
        task.done = !task.done;
        saveData();
        renderLists();
        renderTasks();
      });

      const body = document.createElement('div');
      body.className = 'task-body';
      const meta = formatMeta(task);
      body.innerHTML =
        '<div class="task-title">' + escapeHtml(task.title) + '</div>' +
        (meta ? '<div class="task-meta">' + meta + '</div>' : '');

      const editForm = document.createElement('div');
      editForm.className = 'edit-form';
      editForm.innerHTML =
        '<input type="text" class="edit-title" value="' + escapeAttr(task.title) + '">' +
        '<input type="date" class="edit-date" value="' + (task.date || '') + '">' +
        '<input type="time" class="edit-time" value="' + (task.time || '') + '">';

      const actions = document.createElement('div');
      actions.className = 'task-actions';

      if(editingTaskId === task.id){
        const saveBtn = document.createElement('button');
        saveBtn.className = 'icon-btn';
        saveBtn.textContent = 'Save';
        saveBtn.addEventListener('click', () => {
          const newTitle = editForm.querySelector('.edit-title').value.trim();
          if(newTitle) task.title = newTitle;
          task.date = editForm.querySelector('.edit-date').value;
          task.time = editForm.querySelector('.edit-time').value;
          editingTaskId = null;
          saveData();
          renderTasks();
        });
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'icon-btn';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', () => {
          editingTaskId = null;
          renderTasks();
        });
        actions.appendChild(saveBtn);
        actions.appendChild(cancelBtn);
      } else {
        const editBtn = document.createElement('button');
        editBtn.className = 'icon-btn';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => {
          editingTaskId = task.id;
          renderTasks();
        });
        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn danger';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => {
          list.tasks = list.tasks.filter(t => t.id !== task.id);
          saveData();
          renderLists();
          renderTasks();
        });
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
      }

      li.appendChild(check);
      li.appendChild(body);
      li.appendChild(editForm);
      li.appendChild(actions);
      taskList.appendChild(li);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str){
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  addTaskBtn.addEventListener('click', addTask);
  taskTitleInput.addEventListener('keydown', e => { if(e.key === 'Enter') addTask(); });

  function addTask(){
    const list = getActiveList();
    if(!list) return;
    const title = taskTitleInput.value.trim();
    if(!title) return;
    list.tasks.push({
      id: uid(),
      title,
      date: taskDateInput.value,
      time: taskTimeInput.value,
      done: false
    });
    taskTitleInput.value = '';
    taskDateInput.value = '';
    taskTimeInput.value = '';
    saveData();
    renderLists();
    renderTasks();
    taskTitleInput.focus();
  }

  newListBtn.addEventListener('click', addList);
  newListInput.addEventListener('keydown', e => { if(e.key === 'Enter') addList(); });

  function addList(){
    const name = newListInput.value.trim();
    if(!name) return;
    const list = { id: uid(), name, tasks: [] };
    data.push(list);
    activeListId = list.id;
    newListInput.value = '';
    saveData();
    renderLists();
    renderTasks();
  }

  deleteListBtn.addEventListener('click', () => {
    const list = getActiveList();
    if(!list) return;
    if(!confirm('Delete "' + list.name + '" and all its tasks?')) return;
    data = data.filter(l => l.id !== list.id);
    activeListId = data[0] ? data[0].id : null;
    saveData();
    renderLists();
    renderTasks();
  });

  renderLists();
  renderTasks();
</script>

</body>
</html>
