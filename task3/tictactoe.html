<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe — Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1512;
    --panel: #241C17;
    --cream: #F5EFE6;
    --caramel: #C97C3D;
    --brass: #D4A25A;
    --mocha: #8A6E52;
    --line: rgba(245,239,230,0.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }
  .app{
    width:100%;
    max-width: 780px;
    display:grid;
    grid-template-columns: 1fr 260px;
    gap: 36px;
    align-items:start;
  }
  .header{
    grid-column: 1 / -1;
    margin-bottom: 6px;
  }
  .header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 27px;
    margin: 0 0 4px;
  }
  .header p{
    margin:0;
    font-size: 13.5px;
    color: rgba(245,239,230,0.5);
  }

  .board-panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .status{
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 22px;
    min-height: 22px;
    text-align:center;
  }
  .status .accent{ color: var(--brass); font-weight:600; }

  .board{
    display:grid;
    grid-template-columns: repeat(3, 88px);
    grid-template-rows: repeat(3, 88px);
    gap: 8px;
    margin-bottom: 26px;
  }
  .cell{
    background: rgba(245,239,230,0.03);
    border: 1px solid var(--line);
    border-radius: 4px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background .15s ease, border-color .2s ease;
  }
  .cell:hover:not(.filled){ background: rgba(245,239,230,0.07); }
  .cell.filled{ cursor:default; }
  .cell .mark{
    font-family:'Fraunces', serif;
    font-size: 44px;
    font-weight: 600;
    opacity:0;
    transform: scale(0.6);
    animation: pop .22s ease forwards;
  }
  .cell .mark.x{ color: var(--brass); }
  .cell .mark.o{ color: var(--caramel); }
  @keyframes pop{ to{ opacity:1; transform: scale(1); } }
  .cell.win{ border-color: var(--brass); background: rgba(212,162,90,0.1); }

  .board-actions{ display:flex; gap: 12px; }
  .btn{
    border:none;
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    transition: transform .15s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-primary{ background: var(--brass); color: var(--bg); }
  .btn-ghost{ background:transparent; border: 1px solid var(--mocha); color: var(--cream); }

  /* side panel */
  .side-panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 26px 22px;
  }
  .side-panel h2{
    font-family:'Fraunces', serif;
    font-size: 16px;
    font-weight:600;
    margin: 0 0 16px;
  }
  .mode-toggle{
    display:flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .mode-btn{
    flex:1;
    text-align:center;
    padding: 9px 0;
    font-size: 12.5px;
    font-weight:600;
    border-radius: 999px;
    cursor:pointer;
    color: rgba(245,239,230,0.6);
    transition: background .2s ease, color .2s ease;
  }
  .mode-btn.active{ background: var(--brass); color: var(--bg); }

  .score-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
  }
  .score-row:first-of-type{ border-top:none; }
  .score-row .label{ display:flex; align-items:center; gap: 8px; }
  .score-row .label .mark-x{ color: var(--brass); font-family:'Fraunces', serif; font-weight:700; }
  .score-row .label .mark-o{ color: var(--caramel); font-family:'Fraunces', serif; font-weight:700; }
  .score-row .value{ font-weight:700; font-family:'Fraunces', serif; font-size: 17px; }

  @media (max-width: 700px){
    .app{ grid-template-columns: 1fr; }
    .board{ grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 88px); width:100%; max-width:300px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Tic-Tac-Toe</h1>
    <p>Three in a row wins the round &mdash; play a friend or the roastery's computer while your brew steeps.</p>
  </div>

  <div class="board-panel">
    <div class="status" id="status">X's turn</div>
    <div class="board" id="board"></div>
    <div class="board-actions">
      <button class="btn btn-primary" id="newRoundBtn">New round</button>
      <button class="btn btn-ghost" id="resetScoreBtn">Reset scores</button>
    </div>
  </div>

  <div class="side-panel">
    <h2>Opponent</h2>
    <div class="mode-toggle">
      <div class="mode-btn active" data-mode="computer">Vs. Computer</div>
      <div class="mode-btn" data-mode="human">Vs. Friend</div>
    </div>

    <div class="score-row">
      <span class="label"><span class="mark-x">X</span> Player X</span>
      <span class="value" id="scoreBean">0</span>
    </div>
    <div class="score-row">
      <span class="label"><span class="mark-o">O</span> Player O</span>
      <span class="value" id="scoreCup">0</span>
    </div>
    <div class="score-row">
      <span class="label">Draws</span>
      <span class="value" id="scoreDraw">0</span>
    </div>
  </div>
</div>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const newRoundBtn = document.getElementById('newRoundBtn');
  const resetScoreBtn = document.getElementById('resetScoreBtn');
  const modeButtons = document.querySelectorAll('.mode-btn');
  const scoreBeanEl = document.getElementById('scoreBean');
  const scoreCupEl = document.getElementById('scoreCup');
  const scoreDrawEl = document.getElementById('scoreDraw');

  const BEAN = 'X';
  const CUP = 'O';
  const ICONS = {
    X: '<span class="mark x">X</span>',
    O: '<span class="mark o">O</span>'
  };

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let cells = Array(9).fill(null);
  let current = BEAN;
  let gameOver = false;
  let mode = 'computer'; // 'computer' | 'human'
  let scores = { BEAN: 0, CUP: 0, draw: 0 };
  let autoRoundTimer = null;

  function buildBoard(){
    boardEl.innerHTML = '';
    for(let i=0;i<9;i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.idx = i;
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    }
  }

  function onCellClick(e){
    const idx = Number(e.currentTarget.dataset.idx);
    if(gameOver || cells[idx]) return;
    if(mode === 'computer' && current === CUP) return; // computer's turn, ignore clicks
    placeMark(idx, current);
    if(!gameOver && mode === 'computer' && current === CUP){
      setTimeout(computerMove, 420);
    }
  }

  function placeMark(idx, mark){
    cells[idx] = mark;
    renderCell(idx);
    const win = checkWin(mark);
    if(win){
      endGame(mark, win);
      return;
    }
    if(cells.every(c => c)){
      endGame(null, null);
      return;
    }
    current = current === BEAN ? CUP : BEAN;
    updateStatus();
  }

  function renderCell(idx){
    const cellEl = boardEl.children[idx];
    cellEl.classList.add('filled');
    cellEl.innerHTML = ICONS[cells[idx]];
  }

  function checkWin(mark){
    for(const line of WIN_LINES){
      if(line.every(i => cells[i] === mark)) return line;
    }
    return null;
  }

  function endGame(winner, line){
    gameOver = true;
    if(winner){
      line.forEach(i => boardEl.children[i].classList.add('win'));
      statusEl.innerHTML = '<span class="accent">' + winner + '</span> takes the round';
      scores[winner]++;
    } else {
      statusEl.textContent = "It's a draw — nothing brewed";
      scores.draw++;
    }
    updateScoreboard();
    autoRoundTimer = setTimeout(newRound, 1600);
  }

  function updateStatus(){
    if(gameOver) return;
    statusEl.innerHTML = '<span class="accent">' + current + "</span>'s turn";
  }

  function updateScoreboard(){
    scoreBeanEl.textContent = scores.BEAN;
    scoreCupEl.textContent = scores.CUP;
    scoreDrawEl.textContent = scores.draw;
  }

  function newRound(){
    clearTimeout(autoRoundTimer);
    cells = Array(9).fill(null);
    current = BEAN;
    gameOver = false;
    buildBoard();
    updateStatus();
  }

  function resetScores(){
    scores = { BEAN: 0, CUP: 0, draw: 0 };
    updateScoreboard();
    newRound();
  }

  // --- Minimax computer opponent (plays as CUP, unbeatable) ---
  function computerMove(){
    if(gameOver) return;
    const idx = bestMove();
    if(idx !== -1) placeMark(idx, CUP);
  }

  function bestMove(){
    let bestScore = -Infinity;
    let move = -1;
    for(let i=0;i<9;i++){
      if(!cells[i]){
        cells[i] = CUP;
        const score = minimax(cells, 0, false);
        cells[i] = null;
        if(score > bestScore){
          bestScore = score;
          move = i;
        }
      }
    }
    return move;
  }

  function minimax(board, depth, isMaximizing){
    const winCup = WIN_LINES.some(line => line.every(i => board[i] === CUP));
    const winBean = WIN_LINES.some(line => line.every(i => board[i] === BEAN));
    if(winCup) return 10 - depth;
    if(winBean) return depth - 10;
    if(board.every(c => c)) return 0;

    if(isMaximizing){
      let best = -Infinity;
      for(let i=0;i<9;i++){
        if(!board[i]){
          board[i] = CUP;
          best = Math.max(best, minimax(board, depth+1, false));
          board[i] = null;
        }
      }
      return best;
    } else {
      let best = Infinity;
      for(let i=0;i<9;i++){
        if(!board[i]){
          board[i] = BEAN;
          best = Math.min(best, minimax(board, depth+1, true));
          board[i] = null;
        }
      }
      return best;
    }
  }

  // --- Events ---
  newRoundBtn.addEventListener('click', newRound);
  resetScoreBtn.addEventListener('click', resetScores);
  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      modeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      newRound();
    });
  });

  buildBoard();
  updateStatus();
</script>

</body>
</html>
