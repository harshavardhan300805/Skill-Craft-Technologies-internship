<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brew Timer — Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1512;
    --panel: #241C17;
    --cream: #F5EFE6;
    --brass: #D4A25A;
    --mocha: #8A6E52;
    --line: rgba(245,239,230,0.12);
    --danger: #C9603D;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }
  .app{
    width:100%;
    max-width: 920px;
    display:grid;
    grid-template-columns: 1fr 320px;
    gap: 40px;
    align-items:start;
  }
  .header{
    grid-column: 1 / -1;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 4px;
  }
  .header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 26px;
    margin:0;
  }
  .header .brand-mark{ color: var(--brass); }
  .header span.tag{
    font-size: 13px;
    color: rgba(245,239,230,0.5);
  }

  /* --- Timer panel --- */
  .timer-panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 48px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .dial{
    position:relative;
    width: 280px;
    height: 280px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 36px;
  }
  .dial svg{ position:absolute; inset:0; transform: rotate(-90deg); }
  .dial-track{ fill:none; stroke: rgba(245,239,230,0.08); stroke-width: 5; }
  .dial-progress{
    fill:none;
    stroke: var(--brass);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 754;
    stroke-dashoffset: 754;
    transition: stroke-dashoffset .08s linear;
  }
  .dial-readout{
    text-align:center;
    z-index:2;
  }
  .time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 42px;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .centis{
    font-size: 22px;
    color: var(--brass);
  }
  .phase-label{
    margin-top: 8px;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    color: rgba(245,239,230,0.5);
    text-transform: uppercase;
  }

  .controls{
    display:flex;
    gap: 14px;
  }
  .btn{
    border:none;
    border-radius: 999px;
    padding: 13px 26px;
    font-size: 14.5px;
    font-weight: 600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .btn:disabled{ opacity: .35; cursor: not-allowed; }
  .btn-start{ background: var(--brass); color: var(--bg); }
  .btn-lap{ background: transparent; border: 1px solid var(--mocha); color: var(--cream); }
  .btn-reset{ background: transparent; border: 1px solid var(--danger); color: var(--danger); }

  /* --- Laps panel --- */
  .laps-panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 28px 24px;
    max-height: 468px;
    display:flex;
    flex-direction:column;
  }
  .laps-panel h2{
    font-family:'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .laps-sub{
    font-size: 12.5px;
    color: rgba(245,239,230,0.45);
    margin-bottom: 18px;
  }
  .laps-list{
    list-style:none;
    margin:0; padding:0;
    overflow-y:auto;
    flex:1;
  }
  .laps-list li{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size: 13.5px;
  }
  .laps-list li:first-child{ border-top:none; }
  .laps-list li .lap-idx{
    font-family:'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--brass);
    font-weight:600;
    min-width: 60px;
  }
  .laps-list li.newest{ color: var(--brass); }
  .laps-empty{
    font-size: 13.5px;
    color: rgba(245,239,230,0.4);
    padding: 20px 0;
    text-align:center;
  }

  @media (max-width: 760px){
    .app{ grid-template-columns: 1fr; }
    .dial{ width: 240px; height:240px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1><span class="brand-mark">&#9679;</span>&nbsp; Brew Timer</h1>
    <span class="tag">for pour-over &amp; immersion brews</span>
  </div>

  <div class="timer-panel">
    <div class="dial">
      <svg viewBox="0 0 260 260">
        <circle class="dial-track" cx="130" cy="130" r="120"></circle>
        <circle class="dial-progress" id="dialProgress" cx="130" cy="130" r="120"></circle>
      </svg>
      <div class="dial-readout">
        <div class="time" id="timeDisplay">00:00<span class="centis" id="centiDisplay">.00</span></div>
        <div class="phase-label" id="phaseLabel">Ready to bloom</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" id="resetBtn">Reset</button>
      <button class="btn btn-start" id="startBtn">Start</button>
      <button class="btn btn-lap" id="lapBtn" disabled>Lap</button>
    </div>
  </div>

  <div class="laps-panel">
    <h2>Split times</h2>
    <div class="laps-sub">Mark each brew phase as it happens</div>
    <ul class="laps-list" id="lapsList">
      <li class="laps-empty">No splits recorded yet</li>
    </ul>
  </div>
</div>

<script>
  const timeDisplay   = document.getElementById('timeDisplay');
  const centiDisplay  = document.getElementById('centiDisplay');
  const phaseLabel    = document.getElementById('phaseLabel');
  const startBtn      = document.getElementById('startBtn');
  const lapBtn        = document.getElementById('lapBtn');
  const resetBtn      = document.getElementById('resetBtn');
  const lapsList      = document.getElementById('lapsList');
  const dialProgress  = document.getElementById('dialProgress');

  const CIRCUMFERENCE = 2 * Math.PI * 120; // ~754

  let running = false;
  let startTimestamp = 0;
  let elapsedBeforePause = 0;
  let rafId = null;
  let laps = [];

  const phases = ["Ready to bloom", "Blooming", "Pouring", "Drawing down", "Steady state"];

  function formatTime(ms){
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const sec = totalSec % 60;
    const min = Math.floor(totalSec / 60);
    return {
      main: String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0'),
      centi: '.' + String(cs).padStart(2,'0')
    };
  }

  function currentElapsed(){
    if(!running) return elapsedBeforePause;
    return elapsedBeforePause + (performance.now() - startTimestamp);
  }

  function render(){
    const elapsed = currentElapsed();
    const t = formatTime(elapsed);
    timeDisplay.textContent = t.main;
    centiDisplay.textContent = t.centi;

    // progress ring sweeps once per 60 seconds
    const secFraction = (elapsed % 60000) / 60000;
    dialProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - secFraction);

    if(running){
      const phaseIdx = Math.min(phases.length - 1, laps.length);
      phaseLabel.textContent = phases[phaseIdx];
      rafId = requestAnimationFrame(render);
    }
  }

  function start(){
    running = true;
    startTimestamp = performance.now();
    startBtn.textContent = 'Pause';
    startBtn.classList.remove('btn-start');
    startBtn.style.background = 'var(--cream)';
    lapBtn.disabled = false;
    resetBtn.disabled = true;
    render();
  }

  function pause(){
    running = false;
    elapsedBeforePause = currentElapsed();
    cancelAnimationFrame(rafId);
    startBtn.textContent = 'Resume';
    startBtn.style.background = 'var(--brass)';
    lapBtn.disabled = true;
    resetBtn.disabled = false;
    phaseLabel.textContent = 'Paused';
  }

  function reset(){
    running = false;
    cancelAnimationFrame(rafId);
    elapsedBeforePause = 0;
    laps = [];
    startBtn.textContent = 'Start';
    startBtn.style.background = 'var(--brass)';
    lapBtn.disabled = true;
    resetBtn.disabled = false;
    phaseLabel.textContent = 'Ready to bloom';
    dialProgress.style.strokeDashoffset = CIRCUMFERENCE;
    timeDisplay.textContent = '00:00';
    centiDisplay.textContent = '.00';
    renderLaps();
  }

  function lap(){
    const elapsed = currentElapsed();
    const prevTotal = laps.length ? laps[laps.length - 1].total : 0;
    laps.push({ total: elapsed, split: elapsed - prevTotal });
    renderLaps();
  }

  function renderLaps(){
    lapsList.innerHTML = '';
    if(laps.length === 0){
      lapsList.innerHTML = '<li class="laps-empty">No splits recorded yet</li>';
      return;
    }
    laps.slice().reverse().forEach((lapData, i) => {
      const lapNumber = laps.length - i;
      const li = document.createElement('li');
      if(i === 0) li.classList.add('newest');
      const totalT = formatTime(lapData.total);
      const splitT = formatTime(lapData.split);
      li.innerHTML =
        '<span class="lap-idx">Split ' + lapNumber + '</span>' +
        '<span>+' + splitT.main + splitT.centi + '</span>' +
        '<span>' + totalT.main + totalT.centi + '</span>';
      lapsList.appendChild(li);
    });
  }

  startBtn.addEventListener('click', () => {
    if(!running) start(); else pause();
  });
  lapBtn.addEventListener('click', lap);
  resetBtn.addEventListener('click', reset);

  // init
  dialProgress.style.strokeDashoffset = CIRCUMFERENCE;
  resetBtn.disabled = false;
</script>

</body>
</html>
